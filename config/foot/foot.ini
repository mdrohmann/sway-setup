# Foot terminal configuration
# Full reference: /etc/xdg/foot/foot.ini  or  `man 5 foot`

# JetBrains Mono, installed at /usr/share/fonts/truetype/jetbrains-mono/
# Ctrl+plus / Ctrl+minus adjust size live; Ctrl+0 resets to this value.
font=JetBrains Mono:style=Medium:size=13

# Pinned explicitly: with Medium as the regular weight, the auto-derived
# bold/italic can land on the wrong cut. Swap Bold -> ExtraBold if bold text
# doesn't stand out enough against Medium.
font-bold=JetBrains Mono:style=Bold:size=13
font-italic=JetBrains Mono:style=Medium Italic:size=13
font-bold-italic=JetBrains Mono:style=Bold Italic:size=13

# JetBrains Mono is a tall, tightly-leaded face; a little extra row spacing
# helps. Comment out to use the font's own metrics.
line-height=18

# Scale the font to the monitor's DPI instead of using the compositor's
# scaling factor. Leave 'no' unless text looks wrong on a HiDPI screen.
dpi-aware=no

# Launch zsh explicitly instead of inheriting $SHELL. A session that started
# before `chsh` took effect still exports SHELL=/bin/bash, and foot follows
# $SHELL by default. Redundant once you've logged out and back in, but harmless
# to keep -- and it pins the terminal's shell regardless of session state.
shell=/usr/bin/zsh

# ===========================================================================
# Colors -- Solarized. Values copied verbatim from foot's own theme files in
# /usr/share/foot/themes/ (the `foot-themes` package), inlined rather than
# `include=`d so this config stays self-contained and needs no extra package.
#
# foot loads BOTH sections below at startup and can switch between them:
#     pkill -USR1 foot   ->  [colors]   Solarized Dark   (default)
#     pkill -USR2 foot   ->  [colors2]  Solarized Light
#
# Caveat: those signals only switch between sections already loaded into a
# running process -- foot never re-reads this file. Edits here apply only to
# terminals started afterwards, and the signals do nothing in a foot that was
# launched before these sections existed. There is no reload signal.
# ===========================================================================

# --- Solarized Dark --------------------------------------------------------
[colors]
cursor=     002b36 93a1a1
background= 002b36
foreground= 839496

# The 8 ANSI colors are identical in both Solarized variants -- only the base
# tones (slots 0 and 7, plus fg/bg) flip between dark and light.
regular0=   073642
regular1=   dc322f
regular2=   859900
regular3=   b58900
regular4=   268bd2
regular5=   d33682
regular6=   2aa198
regular7=   eee8d5

# Canonical Solarized repurposes the 8 "bright" slots as extra base greys
# rather than brighter versions of the colors above. Faithful to the spec, but
# it collides with the background: strict bright0 is 002b36, exactly this
# theme's background. These are foot's `solarized-normal-brights` values
# instead -- the regular colors scaled 1.8x in linear RGB. See the bottom of
# this file to switch back to the strict palette.
bright0=    0c4958
bright1=    ff4440
bright2=    aec700
bright3=    ebb300
bright4=    34b5ff
bright5=    ff49aa
bright6=    3ad2c6
bright7=    ffffff

# --- Solarized Light (pkill -USR2 foot) ------------------------------------
[colors2]
cursor=     fdf6e3 586e75
background= fdf6e3
foreground= 657b83

regular0=   eee8d5
regular1=   dc322f
regular2=   859900
regular3=   b58900
regular4=   268bd2
regular5=   d33682
regular6=   2aa198
regular7=   073642

bright0=    ffffff
bright1=    ff4440
bright2=    aec700
bright3=    ebb300
bright4=    34b5ff
bright5=    ff49aa
bright6=    3ad2c6
bright7=    0c4958

# Strict-spec brights, if you'd rather have the canonical muted palette. Note
# the collisions: in dark, bright0 equals the background; in light, bright1
# (bright red) equals the background and is invisible. Replace the bright
# block in the matching section with:
#   [colors]  dark:  002b36 cb4b16 586e75 657b83 839496 6c71c4 93a1a1 fdf6e3
#   [colors2] light: cb4b16 fdf6e3 93a1a1 839496 657b83 6c71c4 586e75 002b36
