[general]
; Color temperature: daytime is roughly neutral, night is noticeably warm.
temp-day=6500
temp-night=4000

; Smooth transition rather than an abrupt jump at sunset.
fade=1

; Fixed coordinates. Geoclue is not usable here: its wifi backend has no
; geolocation URL configured (the Mozilla Location Service it used to default
; to was shut down), and gammastep is not in /etc/geoclue/geoclue.conf's
; app allowlist. Switch to location-provider=geoclue2 if that ever changes.
location-provider=manual

; sway/wlroots gamma control.
adjustment-method=wayland

[manual]
; Your coordinates. Positive lat is north, positive lon is east -- so the
; western hemisphere is negative, which is the sign people get wrong. Two
; decimal places is about a kilometre, and gammastep only needs enough
; precision to get sunset right, so there is no reason to be exact.
;
; Example below is Lisbon. Replace it.
lat=38.72
lon=-9.14
