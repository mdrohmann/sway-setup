# Settings for ~/.local/bin/pomodoro (the waybar tomato). Sourced as shell.
#
# Takes effect on the next tick -- waybar re-runs the script every second, so
# there is nothing to restart. A pomodoro already running keeps its elapsed
# time and just gets the new finish line.

MINUTES=30

# The expiry sound. /usr/share/sounds/gnome/default/alarms/ has plenty more;
# audition with `paplay <file>` first, most of them are much longer than this.
#CHIME=/usr/share/sounds/gnome/default/alarms/chirping.oga
