# Lock screen. Fingerprint and password run concurrently: the sensor is armed
# the whole time the prompt is up, so typing never has to wait for a scan to
# time out (which is what swaylock got wrong).

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1a1aff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(d8d8d8ff)
    font_size = 56
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgba(909090ff)
    font_size = 14
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Password or fingerprint</i>
    # $FPRINTPROMPT surfaces the live sensor state; $FAIL/$ATTEMPTS the failures.
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -20
    halign = center
    valign = center
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning fingerprint
        retry_delay = 250
    }
}
